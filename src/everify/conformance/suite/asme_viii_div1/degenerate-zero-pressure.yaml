id: viii1.degenerate.zero-pressure
title: Zero design pressure must be handled without a division by zero
standard: asme-viii-div1
category: degenerate
rationale: >
  At zero internal design pressure no thickness is required for pressure, so the
  capacity/demand ratio is undefined rather than infinite. A correct implementation
  reports the check as satisfied with no margin value; a naive one divides by zero and
  crashes, or emits an infinity that cannot be serialized into a certificate.
  Other rules that do not depend on pressure, notably the UG-16(b) minimum thickness,
  must still be evaluated normally.
materials:
  CONF-CS-20KSI:
    name: Conformance carbon steel, S = 20.0 ksi
    category: pressure
    allowable_stress:
      basis: Fixed conformance value; not drawn from any code table.
      points:
        - temperature: -20 degF
          value: 20.0 ksi
        - temperature: 650 degF
          value: 20.0 ksi
    provenance:
      source: Synthetic conformance material with a flat allowable stress.
      requires_verification: false
      verified_by_user: true
part:
  id: CONF-VIII1-050
  name: Conformance shell at zero pressure
  material: CONF-CS-20KSI
  geometry:
    type: cylindrical_shell
    inside_diameter: 48 inch
    nominal_thickness: 0.500 inch
  design_conditions:
    design_pressure: 0 psi
    design_temperature: 100 degF
  standards: [asme-viii-div1]
expect_overall: PASS
expect:
  - check_id: viii1.ug27c1
    disposition: PASS
    margin_is_none: true
  - check_id: viii1.mawp
    disposition: PASS
    margin_is_none: true
  - check_id: viii1.ug16b
    disposition: PASS
    margin: 7.0
    margin_tolerance: 1.0e-9
